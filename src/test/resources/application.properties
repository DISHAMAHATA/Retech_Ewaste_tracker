spring.application.name=retech-test

# Isolated In-Memory H2 Test Database (MySQL mode)
spring.datasource.url=jdbc:h2:mem:retech_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates schema in memory for test suite
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Disable automatic demo seeding in unit tests to test cleanly
retech.bootstrap.seed-demo=false
retech.bootstrap.admin.email=admin@retech.org
retech.bootstrap.admin.password=Admin@ReTech2026!
retech.bootstrap.admin.username=admin

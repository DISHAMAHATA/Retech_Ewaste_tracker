spring.application.name=retech
server.port=${PORT:8085}

# MySQL Database DataSource (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/retech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:radhe123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# HikariCP Connection Resiliency (Handles computer sleep / idle timeouts)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# Flyway Migration Configuration
spring.flyway.enabled=false

# Initial Admin & Demo Seeding Configuration
retech.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:admin@retech.org}
retech.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@ReTech2026!}
retech.bootstrap.admin.username=admin
retech.bootstrap.seed-demo=${RETECH_SEED_DEMO:true}

# Session Security Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=4h

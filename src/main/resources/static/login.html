<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ReTech Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 4.25rem - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .demo-accounts {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--neutral-200);
    }
    .demo-pill-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand">
        <div class="brand-icon">&#9851;</div>
        <span>ReTech</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/tracking.html">Track E-Waste</a></li>
        <li><a href="/centres.html">Centres</a></li>
      </ul>
      <div class="nav-user">
        <a href="/register.html" class="btn btn-outline btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--primary-900);">Welcome Back</h1>
        <p style="font-size: 0.9rem; color: var(--neutral-500); margin-top: 0.25rem;">Sign in to your authorized ReTech portal</p>
      </div>

      <div id="login-alert" style="display: none; margin-bottom: 1.25rem; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label required" for="usernameOrEmail">Username or Email</label>
          <input type="text" id="usernameOrEmail" class="form-control" placeholder="e.g. customer@retech-demo.org" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label required" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--neutral-600);">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Create Customer Account</a>
      </div>

      <!-- Quick Demo Account Switcher -->
      <div class="demo-accounts">
        <span style="font-size: 0.775rem; font-weight: 700; color: var(--neutral-500); text-transform: uppercase; letter-spacing: 0.05em;">
          Fast Demo Role Switcher
        </span>
        <div class="demo-pill-group">
          <button type="button" class="btn btn-secondary btn-sm" onclick="autofill('customer@retech-demo.org', 'DemoCustomer123!')">
            &#128100; Customer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="autofill('agent@retech-demo.org', 'DemoAgent123!')">
            &#128666; Agent
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="autofill('operator@retech-demo.org', 'DemoOperator123!')">
            &#9881; Operator
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="autofill('admin@retech.org', 'Admin@ReTech2026!')">
            &#128274; Admin
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function autofill(u, p) {
      document.getElementById('usernameOrEmail').value = u;
      document.getElementById('password').value = p;
      document.getElementById('login-alert').style.display = 'none';
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');

    // Check URL parameters for notices
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      alertBox.textContent = 'Your session has expired. Please sign in again.';
      alertBox.style.background = '#fef3c7';
      alertBox.style.color = '#92400e';
      alertBox.style.display = 'block';
    } else if (urlParams.get('registered')) {
      alertBox.textContent = 'Account created successfully! Please sign in with your credentials.';
      alertBox.style.background = '#d1fae5';
      alertBox.style.color = '#065f46';
      alertBox.style.display = 'block';
    } else if (urlParams.get('logged_out')) {
      alertBox.textContent = 'You have been safely signed out.';
      alertBox.style.background = '#f1f5f9';
      alertBox.style.color = '#334155';
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing In...';

      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await ReTech.api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ usernameOrEmail, password })
        });

        if (res && res.success && res.data) {
          sessionStorage.setItem('retech_user', JSON.stringify(res.data));
          ReTech.showToast('Welcome, ' + res.data.fullName, 'success');

          // Direct role routing
          const role = res.data.role;
          let target = '/dashboard.html';
          if (role === 'ROLE_AGENT') target = '/agent.html';
          if (role === 'ROLE_OPERATOR') target = '/facility.html';
          if (role === 'ROLE_ADMIN') target = '/admin.html';

          // If redirect param present and matches role, route there
          const redirect = urlParams.get('redirect');
          if (redirect && redirect.startsWith('/')) {
            target = redirect;
          }

          window.location.href = target;
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid username, email, or password.';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#991b1b';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
